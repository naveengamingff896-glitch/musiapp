<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mana Music — Telugu-first Indian music streaming</title>
    <meta
      name="description"
      content="Mana Music is a Telugu-first Indian music streaming prototype with demo audio, playlists, radio and podcasts across 22 Indian languages."
    />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mana Music" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/logo.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <style>
      html {
        background: #0a0a0c;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0a0a0c;
        color: #f6efe6;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        gap: 14px;
        text-align: center;
      }
      #boot strong {
        font-size: 20px;
        letter-spacing: 0.14em;
      }
      #boot span {
        font-size: 12px;
        opacity: 0.6;
        letter-spacing: 0.22em;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div>
        <strong>MANA MUSIC</strong>
        <div><span>MANA · TELUGU FIRST</span></div>
      </div>
    </div>
    <noscript>Mana Music needs JavaScript enabled to stream the demo catalogue.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
